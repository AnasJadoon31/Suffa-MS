services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mms
      POSTGRES_USER: mms
      POSTGRES_PASSWORD: mms_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mms -d mms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: suffa-ms-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mms}:${POSTGRES_PASSWORD:-mms_password}@postgres:5432/${POSTGRES_DB:-mms}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: ${MINIO_ENDPOINT}
      S3_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      S3_BUCKET: ${MINIO_BUCKET:-suffa-ms}
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-}
      EVOLUTION_WEBHOOK_BASE64: ${EVOLUTION_WEBHOOK_BASE64:-true}
      EVOLUTION_WEBHOOK_EVENTS: ${EVOLUTION_WEBHOOK_EVENTS:-}
      SECRET_KEY: ${SECRET_KEY}
      DEFAULT_TENANT: ${DEFAULT_TENANT:-suffa}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MADRASA_NAME: ${MADRASA_NAME:-Suffa Madrasa}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-platform-admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_BUCKET: ${MINIO_BUCKET:-suffa-ms}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    networks:
      - default
      - coolify
    labels:
      - "traefik.docker.network=coolify"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Container health should prove the API process is serving HTTP.
      # /readyz still checks the database and remains useful for diagnostics,
      # but using it here makes `docker compose up -d` fail when Compose waits
      # on service_healthy while the DB is briefly slow or externally managed.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker:
    image: suffa-ms-backend
    command: arq app.worker.WorkerSettings
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mms}:${POSTGRES_PASSWORD:-mms_password}@postgres:5432/${POSTGRES_DB:-mms}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      DEFAULT_TENANT: ${DEFAULT_TENANT:-suffa}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - coolify
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${API_BASE}
    environment:
      VITE_API_BASE: ${API_BASE}
    ports:
      - "5173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  coolify:
    external: true

volumes:
  pgdata:
