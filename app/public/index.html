<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Suffa MS</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      // SPA shell for offline fallback. The real app is hydrated by the SSR server
      // on first load; when offline this shell boots the client from cache.
      window.__SPA_FALLBACK__ = true;
    </script>
  </head>
  <body>
    <div id="app">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;font-family:system-ui,sans-serif;background:#f8fafc">
        <div style="width:48px;height:48px;border:4px solid #0d9488;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></div>
        <p style="margin-top:16px;color:#64748b;font-size:14px">Loading Suffa MS...</p>
      </div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </body>
</html>
