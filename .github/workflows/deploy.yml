name: Build and Push to GHCR

on:
  push:
    branches: [main, staging] # Add any branches you want to build here

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # Dynamically tags with the branch name (e.g., :main or :staging)
          tags: ghcr.io/anasjadoon31/suffa-ms-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          # Dynamically tags with the branch name
          tags: ghcr.io/anasjadoon31/suffa-ms-app:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only trigger the Production Coolify webhooks if the branch is 'main'
      - name: Trigger Production Deployment
        if: github.ref_name == 'main'
        run: |
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK_BACKEND_MAIN }}"
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK_FRONTEND_MAIN }}"

      # Only trigger the Staging Coolify webhooks if the branch is 'staging'
      - name: Trigger Staging Deployment
        if: github.ref_name == 'staging'
        run: |
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK_BACKEND_STAGING }}"
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK_FRONTEND_STAGING }}"
